name: Build Claybel APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/build-apk.yml", "*.dart"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream CT-221B project
        uses: actions/checkout@v4
        with:
          repository: DFC1990/flutter_label_printer_kit
          ref: main
      - name: Checkout Claybel editor source
        uses: actions/checkout@v4
        with:
          path: claybel
      - name: Fix toast overlay app context and add regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('example/lib/main.dart')
          s = p.read_text()
          old = "    return CtToastOverlay(\n      controller: _toast,\n      child: MaterialApp(\n        title: 'flutter_label_printer_kit Example',\n        theme: ThemeData(colorSchemeSeed: Colors.blue, useMaterial3: true),\n        home: HomePage(printer: _printer, toast: _toast),\n      ),\n    );"
          new = "    return MaterialApp(\n      title: 'Claybel CT221B',\n      theme: ThemeData(colorSchemeSeed: Colors.blue, useMaterial3: true),\n      builder: (context, child) => CtToastOverlay(\n        controller: _toast,\n        child: child ?? const SizedBox.shrink(),\n      ),\n      home: HomePage(printer: _printer, toast: _toast),\n    );"
          if s.count(old) != 1:
              raise SystemExit('Expected upstream app root not found; inspect before patching')
          p.write_text(s.replace(old, new))
          t = Path('example/test/app_root_regression_test.dart')
          t.parent.mkdir(parents=True, exist_ok=True)
          t.write_text("import 'package:flutter/material.dart';\nimport 'package:flutter_test/flutter_test.dart';\nimport 'package:flutter_label_printer_kit/flutter_label_printer_kit.dart';\nimport 'package:shared_preferences/shared_preferences.dart';\nimport '../lib/main.dart';\n\nvoid main() {\n  testWidgets('app root provides Directionality to toast overlay', (tester) async {\n    SharedPreferences.setMockInitialValues({});\n    await tester.pumpWidget(const MyApp());\n    await tester.pump();\n    expect(tester.takeException(), isNull);\n    expect(find.byType(HomePage), findsOneWidget);\n    expect(Localizations.localeOf(tester.element(find.byType(HomePage))), const Locale('en'));\n    expect(find.text('Claybel CT221B'), findsOneWidget);\n    expect(PrinterLiveStatusUiState.noPaper.label, 'Out of paper');\n    expect(Directionality.of(tester.element(find.byType(CtToastOverlay))), TextDirection.ltr);\n    await tester.pumpWidget(const SizedBox.shrink());\n  });\n}\n")
          
          PY
      - name: Translate all printer UI and messages to English
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          translations = {'Druckernamen setzen': 'Set printer name', 'GERÄT': 'DEVICE', 'ADRESSE': 'ADDRESS', 'Eigener Name': 'Custom name', 'z. B. Versand 1 oder Lager Nord': 'e.g. Shipping 1 or North warehouse', 'Alias löschen': 'Remove alias', 'Abbrechen': 'Cancel', 'Speichern': 'Save', 'Verbinden': 'Connect', 'Bluetooth-Name unbekannt': 'Unknown Bluetooth name', 'VERBUNDEN': 'CONNECTED', 'ERKANNT': 'DISCOVERED', 'FESTER DRUCKER': 'PREFERRED PRINTER', 'Weitere Aktionen': 'More actions', 'Als festen Drucker markieren': 'Set as preferred printer', 'Festen Drucker lösen': 'Clear preferred printer', 'Namen ändern': 'Rename', 'Eigenen Namen setzen': 'Set custom name', 'Eigenen Namen entfernen': 'Remove custom name', 'Aktiv': 'Active', 'Bluetooth-Drucker': 'Bluetooth printers', 'Drucker suchen, verbinden und verwalten': 'Find, connect and manage printers', 'Suche läuft': 'Scanning', 'Neu suchen': 'Scan again', 'Verbinde...': 'Connecting...', 'Bluetooth-Suche läuft...': 'Scanning for Bluetooth printers...', 'Noch keine Drucker gefunden.': 'No printers found yet.', 'Scanner bereit': 'Scanner ready', 'Gekoppelte, sichtbare und bekannte Drucker werden geladen.': 'Loading paired, visible and saved printers.', 'Erkannte Drucker können verbunden, markiert und umbenannt werden.': 'Discovered printers can be connected, saved and renamed.', 'Bereit': 'Ready', 'Bluetooth aus': 'Bluetooth off', 'Getrennt': 'Disconnected', 'Fehler': 'Error', 'Deckel offen': 'Cover open', 'Kein Papier': 'Out of paper', 'Verbunden': 'Connected', 'AKKU·': 'BATTERY·', 'Drucker-Einstellungen': 'Printer settings', 'Auto-Connect, Status-Polling & TSPL-Grundwerte': 'Auto-connect, status polling and TSPL defaults', 'VERBINDUNG': 'CONNECTION', 'Known-Printer Auto-Connect': 'Saved printer auto-connect', 'Feste oder zuletzt verbundene Drucker beim Start verbinden': 'Connect to the preferred or last printer on startup', 'Festen Drucker bevorzugen': 'Prefer saved printer', 'Zugeordneten Drucker vor dem letzten versuchen': 'Try the preferred printer before the last printer', 'Letzten Drucker wiederverbinden': 'Reconnect last printer', 'Zuletzt erfolgreiches Gerät als Fallback nutzen': 'Use the last connected device as a fallback', 'Hintergrundsuche': 'Background scan', 'Leiser Scan, wenn Zielgerät nicht erreichbar': 'Scan silently when the target device is unavailable', 'Settings-Icon in Scanseite': 'Settings icon on scan page', 'STATUS-MONITORING': 'STATUS MONITORING', 'Live-Status-Polling': 'Live status polling', 'Abfrage alle ${_settings.statusPollIntervalMs} ms': 'Poll every ${_settings.statusPollIntervalMs} ms', 'Polling pausiert': 'Polling paused', 'POLLING-INTERVALL': 'POLLING INTERVAL', 'BENACHRICHTIGUNGEN': 'NOTIFICATIONS', 'Bei Verbindung': 'When connected', 'Bei Druckstart': 'When printing starts', 'Bluetooth deaktiviert': 'Bluetooth disabled', 'Status bereit': 'Printer ready', 'Papier leer': 'Out of paper', 'Fehlerzustände': 'Errors', 'DARSTELLUNG': 'APPEARANCE', 'DESIGN-MODUS': 'THEME', 'DRUCKPROFIL': 'PRINT PROFILE', 'PAPIERFORMAT': 'PAPER SIZE', 'Hell': 'Light', 'Dunkel': 'Dark', 'LABEL VORSCHAU': 'LABEL PREVIEW', 'Vorschau fehlgeschlagen': 'Preview failed', 'Kein Drucker aktiv': 'No active printer', 'Verbindung wird aufgebaut': 'Connecting', 'Nicht verbunden': 'Not connected', 'Kein Drucker verbunden': 'No printer connected', 'Adresse': 'Address', 'Modell': 'Model', 'Akku': 'Battery', 'DRUCKERINFORMATIONEN': 'PRINTER INFORMATION', 'Info abrufen': 'Read information', 'Beim Start automatisch bekannte Drucker verbinden': 'Automatically connect saved printers on startup', 'Gemappten Drucker bevorzugen': 'Prefer saved printer', 'Fix zugeordneten Drucker zuerst versuchen': 'Try the preferred printer first', 'Letztes Gerät wiederverbinden': 'Reconnect last device', 'Zuletzt erfolgreiche Verbindung als Fallback': 'Use the last successful connection as a fallback', 'Stiller Scan, wenn Zielgerät nicht erreichbar': 'Scan silently when the target device is unavailable', 'Settings-Icon in Scan-Seite': 'Settings icon on scan page', 'Polling alle ${_settings.statusPollIntervalMs} ms': 'Poll every ${_settings.statusPollIntervalMs} ms', 'Druck gestartet': 'Print started', 'Bluetooth-Hinweis anzeigen': 'Show Bluetooth prompt', 'iOS BLE Native-Logs': 'iOS BLE native logs', 'Schreibt CoreBluetooth-Logs in die Xcode-Konsole': 'Write CoreBluetooth logs to the Xcode console', 'Lade aktuellen Status...': 'Loading current status...', 'Einstellungen speichern': 'Save settings', 'Kein Status': 'No status', 'Noch kein CT221B-Status erkannt.': 'No CT221B status received yet.', 'Drucker verbinden': 'Connect printer', 'Bluetooth-Name:': 'Bluetooth name:', 'Modell:': 'Model:', 'Druckertest': 'Printer test', 'Artikel 123': 'Item 123', ' Produktion': ' Production', 'Fester Preset-Aufruf per Button': 'Fixed preset from button', 'Referenz': 'Reference', 'Feste Koordinaten fuer den CT221B-Pfad.': 'Fixed coordinates for the CT221B protocol.', 'Textumbruch neben dem QR-Code mit Zeilenlimit.': 'Wrap text beside the QR code with a line limit.', 'Spaltenbasierter Layout-Helfer.': 'Column-based layout helper.', 'Bearbeitbare Felder fuer eigene Labels.': 'Editable fields for custom labels.', 'fehlgeschlagen': 'failed', 'Suche Drucker...': 'Searching for printers...', 'Pruefe Verbindung...': 'Checking connection...', 'Drucker suchen': 'Find printers', '${selected.displayName} verbunden': '${selected.displayName} connected', 'Lese Geraeteinfo...': 'Reading device information...', 'Lese Status...': 'Reading status...', 'Drucke ${_activePreset.title}...': 'Printing ${_activePreset.title}...', 'Druck gesendet': 'Print sent', 'Verbinde erneut...': 'Reconnecting...', 'Verbinde ${device.displayName}...': 'Connecting to ${device.displayName}...', 'Speichere bekannten Drucker...': 'Saving printer...', 'Entferne bekannten Drucker...': 'Removing saved printer...', 'Speichere Alias...': 'Saving alias...', 'Entferne Alias...': 'Removing alias...', ' Versandlabel': ' Shipping label', 'CT221B Referenzpfad fuer Android und iOS': 'CT221B reference protocol for Android and iOS', 'Dichte': 'Density', 'Maximal 2 Zeilen neben dem QR-Code': 'Maximum 2 lines beside the QR code', 'Schnelles Preset fuer feste Layouts': 'Quick preset for fixed layouts', 'Eigenes Label mit dynamischem QR-Code': 'Custom label with a dynamic QR code', 'Diese Testseite unterstuetzt aktuell nur Android und iOS.': 'This test page currently supports Android and iOS only.', 'Uebersicht': 'Overview', 'Druck': 'Print', 'Trennen': 'Disconnect', 'Suche': 'Scan', 'Drucker finden': 'Find printers', 'Abrufen': 'Read', 'Einmal lesen': 'Read once', 'Drucken': 'Print', 'Letztes Geraet': 'Last device', 'Einstellungen': 'Settings', 'Einstellungen gespeichert': 'Settings saved', 'Gefundene Drucker': 'Discovered printers', 'Aktualisieren': 'Refresh', 'Suche laeuft...': 'Scanning...', 'Noch keine Drucker gefunden. Oben auf Suche tippen.': 'No printers found yet. Tap Scan above.', 'Ausrichtung': 'Orientation', '0 Grad': '0 degrees', '90 Grad': '90 degrees', 'Vorschau': 'Preview', 'Drucken:': 'Print:', 'Statusdiagnose': 'Status diagnostics', 'Noch kein Status': 'No status yet', 'Papier:': 'Paper:', 'Deckel:': 'Cover:', 'Bereit:': 'Ready:', 'Fehler:': 'Error:', 'Ja': 'Yes', 'Nein': 'No', 'Verbindung prüfen': 'Check connection', 'Status lesen': 'Read status', 'Statusaenderungen': 'Status changes', 'Noch keine Statusaenderungen erkannt.': 'No status changes received yet.', 'Protokoll': 'Log', 'Noch keine Logeintraege.': 'No log entries yet.', 'Bearbeiten': 'Edit', 'Auto-Connect an': 'Auto-connect on', 'Auto-Connect aus': 'Auto-connect off', 'Polling aus': 'Polling off', 'Bekannt:': 'Saved:', 'Titel': 'Title', 'Untertitel': 'Subtitle', 'Fusstext': 'Footer', 'QR-Daten': 'QR data', 'Unbekannt': 'Unknown', 'Eingelegt': 'Loaded', 'Leer': 'Empty', 'Offen': 'Open', 'Geschlossen': 'Closed', 'Bluetooth-Einstellungen geoeffnet': 'Bluetooth settings opened', 'Verbindungssnapshot meldet keinen aktiven Drucker mehr.': 'Connection snapshot reports no active printer.', 'Verbindung zu ${resolvedDevice.displayName} wurde direkt wieder getrennt.': 'Connection to ${resolvedDevice.displayName} was immediately disconnected.', 'Druckerverbindung verloren.': 'Printer connection lost.', 'Druckerverbindung verloren: $normalizedReason': 'Printer connection lost: $normalizedReason', 'Drucker ${device.displayName} verbunden': 'Printer ${device.displayName} connected', 'Drucker': 'Printer', 'Druck gestartet auf $deviceName$suffix': 'Print started on $deviceName$suffix', 'Drucker hat kein Papier': 'Printer is out of paper', 'Druckerdeckel ist offen': 'Printer cover is open', 'Druckerfehler ${status.codeHex}': 'Printer error ${status.codeHex}', 'Drucker ist bereit': 'Printer is ready', 'Bitte Bluetooth einschalten': 'Please enable Bluetooth', 'Bluetooth oeffnen': 'Open Bluetooth settings', 'Das Android-Live-Statusframe lieferte den Rohstatus $codeHex. Der Wert wird gespeichert, aber nur vorsichtig heuristisch interpretiert.': 'The Android live status frame returned raw status $codeHex. The value is stored and interpreted cautiously using heuristics.', 'Der Drucker ist bereit (Status 0x20).': 'The printer is ready (status 0x20).', 'Der Druckerdeckel ist nicht geschlossen (Status 0x05).': 'The printer cover is open (status 0x05).', 'Dem Drucker fehlt Papier (Status 0x04).': 'The printer is out of paper (status 0x04).', 'Status 0x01 ist noch nicht vollständig verifiziert und wird vorsichtig als Fehler behandelt.': 'Status 0x01 is not fully verified and is cautiously treated as an error.', 'Nicht verifizierter Android-Statuswert $codeHex ohne sichere Interpretation.': 'Unverified Android status value $codeHex without a reliable interpretation.'}
          for root in ('lib', 'example/lib'):
              for path in Path(root).rglob('*.dart'):
                  source = path.read_text()
                  # Replace complete string contents; preserve identifiers and protocol data.
                  for german, english in sorted(translations.items(), key=lambda item: -len(item[0])):
                      source = source.replace("'" + german + "'", "'" + english + "'")
                  # Translate prefixes and interpolated diagnostic labels.
                  for german, english in (('Drucken:', 'Print:'), ('AKKU·', 'BATTERY·'), ('Bluetooth-Name:', 'Bluetooth name:'), ('Modell:', 'Model:'), ('Papier:', 'Paper:'), ('Deckel:', 'Cover:'), ('Bereit:', 'Ready:'), ('Fehler:', 'Error:'), ('Akku:', 'Battery:'), ('Bekannt:', 'Saved:'), ('Dichte ', 'Density '), ('Unbekannt ', 'Unknown '), (' fehlgeschlagen', ' failed')):
                      source = source.replace(german, english)
                  path.write_text(source)
          p = Path('example/lib/main.dart')
          s = p.read_text().replace("title: 'Claybel CT221B',", "title: 'Claybel CT221B',\n      locale: const Locale('en'),\n      supportedLocales: const [Locale('en')],")
          s = s.replace('flutter_label_printer_kit Example', 'Claybel CT221B')
          p.write_text(s)
          PY
      - name: Install editable label canvas and image import
        run: |
          cp claybel/label_editor.dart example/lib/label_editor.dart
          cp claybel/label_editor_test.dart example/test/label_editor_test.dart
          cp claybel/qr_renderer.dart lib/src/renderer/qr_renderer.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('example/pubspec.yaml')
          s = p.read_text().replace('  cupertino_icons:', '  file_selector: ^1.1.0\n  qr: ^3.0.2\n  shared_preferences: ^2.2.2\n  cupertino_icons:')
          p.write_text(s)
          p = Path('example/lib/main.dart')
          s = p.read_text().replace("import 'package:flutter/material.dart';", "import 'package:flutter/material.dart';\nimport 'label_editor.dart';")
          s = s.replace("            const Text('Quick Actions'", "            FilledButton.icon(\n              icon: const Icon(Icons.edit_outlined),\n              label: const Text('Label editor'),\n              onPressed: () => Navigator.of(context).push(MaterialPageRoute<void>(builder: (_) => LabelEditorPage(printer: printer))),\n            ),\n            const SizedBox(height: 16),\n            const Text('Quick Actions'")
          if "label: const Text('Label editor')" not in s:
              raise SystemExit('Expected home editor entry point not found')
          p.write_text(s)
          p = Path('lib/src/widgets/label_preview.dart')
          s = p.read_text().replace('final int byteIndex = (y * widthPx + x) ~/ 8;', 'final int byteIndex = y * ((widthPx + 7) ~/ 8) + x ~/ 8;')
          s = s.replace('final int bitIndex = 7 - (y * widthPx + x) % 8;', 'final int bitIndex = 7 - x % 8;')
          s = s.replace('final bool isBlack = (monoBitmap[byteIndex] >> bitIndex) & 1 == 1;', 'final bool isBlack = ((monoBitmap[byteIndex] >> bitIndex) & 1) == 0;')
          p.write_text(s)
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Install example dependencies
        working-directory: example
        run: flutter pub get
      - name: Check editor code
        working-directory: example
        run: |
          dart format lib/label_editor.dart test/label_editor_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/label_editor.dart
      - name: Verify app root regression
        working-directory: example
        run: flutter test test/app_root_regression_test.dart test/label_editor_test.dart
      - name: Build release APK
        working-directory: example
        run: flutter build apk --release --build-number=4
      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp example/build/app/outputs/flutter-apk/app-release.apk artifacts/Claybel-CT221B-Editor-v4.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Claybel-CT221B-Editor-v4
          path: artifacts/Claybel-CT221B-Editor-v4.apk
          if-no-files-found: error
          retention-days: 30
